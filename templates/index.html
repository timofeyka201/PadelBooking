<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Padel Court</title>
    <script src="https://telegram.org/js/telegram-widget.js?21"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #10B981;
            --primary-dark: #059669;
            --primary-light: #D1FAE5;
            --danger: #DC2626;
            --warning: #F59E0B;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-600: #4B5563;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --gray-900: #111827;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gray-50);
            color: var(--gray-900);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .landing {
            background: linear-gradient(180deg, #064E3B 0%, #10B981 100%);
            padding: 60px 20px 40px;
            color: white;
            text-align: center;
        }

        .landing-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .landing-logo svg {
            width: 48px;
            height: 48px;
        }

        .landing-logo span {
            font-size: 28px;
            font-weight: 700;
        }

        .landing h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .landing p {
            font-size: 16px;
            opacity: 0.9;
            max-width: 300px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            padding: 24px 20px;
            background: white;
            border-radius: 20px 20px 0 0;
            margin-top: -20px;
        }

        .feature-item {
            text-align: center;
        }

        .feature-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-light);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-size: 24px;
        }

        .feature-item span {
            font-size: 12px;
            color: var(--gray-600);
        }

        .cta-section {
            padding: 20px;
            background: white;
        }

        .cta-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .section {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title .count {
            background: var(--gray-100);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-600);
        }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--gray-200);
        }

        .game-card:active {
            transform: scale(0.98);
        }

        .game-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .game-card-title {
            font-size: 16px;
            font-weight: 600;
        }

        .game-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 600;
        }

        .badge-open {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .badge-closed {
            background: #FEF3C7;
            color: #92400E;
        }

        .badge-full {
            background: #FEE2E2;
            color: #991B1B;
        }

        .badge-level {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .game-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--gray-500);
            margin-top: 8px;
        }

        .game-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .game-players {
            display: flex;
            gap: 4px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--gray-100);
        }

        .player-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
        }

        .player-dot.pending {
            background: var(--warning);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray-400);
            background: white;
            border-radius: 16px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--gray-50);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 0;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            color: var(--gray-400);
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .modal-body {
            padding: 20px;
            background: var(--gray-50);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            background: white;
        }

        .form-group textarea {
            min-height: 80px;
            resize: none;
        }

        .level-selector {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .level-btn {
            padding: 12px 8px;
            border: 2px solid var(--gray-200);
            border-radius: 10px;
            background: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--gray-600);
        }

        .level-btn.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .type-btn {
            padding: 14px;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            background: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .type-btn.active {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .type-btn small {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: var(--gray-500);
            margin-top: 4px;
        }

        .calendar-section {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .calendar-nav button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            color: var(--gray-600);
        }

        .calendar-title {
            font-size: 16px;
            font-weight: 600;
        }

        .calendar-days {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .calendar-day {
            flex-shrink: 0;
            width: 48px;
            text-align: center;
            padding: 12px 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--gray-50);
        }

        .calendar-day.active {
            background: var(--primary);
            color: white;
        }

        .calendar-day.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .calendar-day .day-name {
            font-size: 10px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .calendar-day .day-num {
            font-size: 18px;
            font-weight: 700;
            margin-top: 4px;
        }

        .time-slots {
            margin-top: 16px;
        }

        .time-slots-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-600);
            margin-bottom: 12px;
        }

        .time-slots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .time-slot {
            padding: 12px 8px;
            border: 2px solid var(--gray-200);
            border-radius: 10px;
            background: white;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .time-slot:hover:not(.disabled) {
            border-color: var(--primary);
        }

        .time-slot.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .time-slot.disabled {
            background: var(--gray-100);
            color: var(--gray-400);
            cursor: not-allowed;
            border-color: transparent;
        }

        .time-slot.occupied {
            background: var(--gray-100);
            color: var(--gray-400);
            cursor: not-allowed;
            border-color: transparent;
            text-decoration: line-through;
        }

        .modal-footer {
            padding: 16px 20px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            display: flex;
            gap: 12px;
            background: white;
            border-top: 1px solid var(--gray-200);
        }

        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--gray-200);
            color: var(--gray-700);
        }

        .btn-danger {
            background: #FEE2E2;
            color: var(--danger);
        }

        .detail-info {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--gray-100);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--gray-500);
            font-size: 14px;
        }

        .detail-value {
            font-weight: 600;
            font-size: 14px;
        }

        .team-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .team-box {
            background: white;
            padding: 16px;
            border-radius: 12px;
        }

        .team-box h4 {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--gray-400);
            margin-bottom: 12px;
        }

        .team-player {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            font-size: 14px;
            font-weight: 500;
        }

        .team-player .status {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 6px;
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .team-player .status.pending {
            background: #FEF3C7;
            color: #92400E;
        }

        .pending-section {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .pending-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--warning);
        }

        .pending-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--gray-100);
        }

        .pending-actions {
            display: flex;
            gap: 8px;
        }

        .pending-actions button {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .pending-approve {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .pending-reject {
            background: #FEE2E2;
            color: var(--danger);
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gray-900);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
        }

        .fixed-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            background: white;
            border-top: 1px solid var(--gray-200);
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .auth-modal .modal {
            max-height: 80vh;
        }

        .auth-switch {
            text-align: center;
            padding: 0 20px 20px;
            color: var(--gray-500);
            font-size: 14px;
        }

        .auth-switch a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .user-badge {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            position: fixed;
            top: 12px;
            right: 20px;
            z-index: 101;
        }

        @media (max-width: 400px) {
            .level-selector {
                grid-template-columns: repeat(7, 1fr);
            }
            
            .level-btn {
                padding: 10px 4px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="user-badge" id="user-badge" onclick="handleUserBadgeClick()">Вход</div>

    <div class="landing">
        <div class="landing-logo">
            <svg viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="16" r="14" stroke="white" stroke-width="3"/>
                <circle cx="16" cy="16" r="8" fill="white" opacity="0.3"/>
                <circle cx="16" cy="16" r="4" fill="white"/>
            </svg>
            <span>Padel Court</span>
        </div>
        <h1>Играй в падел<br>с другими</h1>
        <p>Создавай игры, находи партнёров и наслаждайся игрой на любом уровне</p>
    </div>

    <div class="features">
        <div class="feature-item">
            <div class="feature-icon">🎯</div>
            <span>Любой уровень</span>
        </div>
        <div class="feature-item">
            <div class="feature-icon">👥</div>
            <span>4 игрока</span>
        </div>
        <div class="feature-item">
            <div class="feature-icon">📅</div>
            <span>Бронируй слот</span>
        </div>
    </div>

    <div class="cta-section">
        <button class="cta-btn" onclick="showCreateModal()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"/>
            </svg>
            Создать игру
        </button>
    </div>

    <div class="section">
        <h2 class="section-title">
            Ближайшие игры
            <span class="count" id="games-count">0</span>
        </h2>
        <div class="games-list" id="games-list">
            <div class="empty-state">Загрузка...</div>
        </div>
    </div>

    <div class="modal-overlay" id="create-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Новая игра</h3>
                <button class="modal-close" onclick="closeCreateModal()">&times;</button>
            </div>
            <form class="modal-body" onsubmit="createGame(event)">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="game-title" required placeholder="Утренняя игра">
                </div>
                
                <div class="form-group">
                    <label>Уровень игры</label>
                    <div class="level-selector" id="level-selector">
                        <button type="button" class="level-btn" data-level="D">D</button>
                        <button type="button" class="level-btn" data-level="D+">D+</button>
                        <button type="button" class="level-btn" data-level="C">C</button>
                        <button type="button" class="level-btn" data-level="C+">C+</button>
                        <button type="button" class="level-btn" data-level="B">B</button>
                        <button type="button" class="level-btn" data-level="A">A</button>
                        <button type="button" class="level-btn active" data-level="all">все</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Тип игры</label>
                    <div class="type-selector" id="type-selector">
                        <button type="button" class="type-btn active" data-type="open">
                            Открытая
                            <small>Свободный вход</small>
                        </button>
                        <button type="button" class="type-btn" data-type="closed">
                            Закрытая
                            <small>Нужно подтверждение</small>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Комментарий</label>
                    <textarea id="game-description" placeholder="Что взять с собой, особые условия..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Дата и время</label>
                    <div class="calendar-section">
                        <div class="calendar-header">
                            <div class="calendar-nav">
                                <button type="button" onclick="changeMonth(-1)">&larr;</button>
                                <span class="calendar-title" id="calendar-title"></span>
                                <button type="button" onclick="changeMonth(1)">&rarr;</button>
                            </div>
                        </div>
                        <div class="calendar-days" id="calendar-days"></div>
                        <div class="time-slots">
                            <div class="time-slots-label">Доступное время</div>
                            <div class="time-slots-grid" id="time-slots"></div>
                        </div>
                    </div>
                </div>
            </form>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeCreateModal()">Отмена</button>
                <button class="btn btn-primary" onclick="document.querySelector('#create-modal form').requestSubmit()">Создать</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="detail-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="detail-title">Игра</h3>
                <button class="modal-close" onclick="closeDetailModal()">&times;</button>
            </div>
            <div class="modal-body" id="detail-content"></div>
            <div class="modal-footer" id="detail-actions"></div>
        </div>
    </div>

    <div class="modal-overlay" id="auth-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="auth-modal-title">Вход</h3>
                <button class="modal-close" onclick="closeAuth()">&times;</button>
            </div>
            <form class="modal-body" onsubmit="submitAuth(event)">
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="auth-username" required placeholder="Придумайте логин">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="auth-password" required placeholder="Минимум 4 символа">
                </div>
                <div class="form-group" id="firstname-group" style="display:none;">
                    <label>Ваше имя</label>
                    <input type="text" id="auth-firstname" placeholder="Как к вам обращаться">
                </div>
            </form>
            <div class="modal-footer">
                <button class="btn btn-primary" id="auth-submit-btn" onclick="document.querySelector('#auth-modal form').requestSubmit()">Войти</button>
            </div>
            <p class="auth-switch">
                <span id="auth-switch">Нет аккаунта? <a href="#" onclick="showAuth('register'); return false;">Регистрация</a></span>
            </p>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <script>
        const API_URL = '';
        let currentUser = null;
        let games = [];
        let showAuthModal = 'login';
        
        let selectedLevel = 'all';
        let selectedType = 'open';
        let selectedDate = null;
        let selectedTime = null;
        let currentMonth = new Date();
        let occupiedSlots = [];

        const TIME_SLOTS = [
            '07:00', '08:00', '09:00', '10:00',
            '11:00', '12:00', '13:00', '14:00',
            '15:00', '16:00', '17:00', '18:00',
            '19:00', '20:00', '21:00', '22:00'
        ];

        function getAuthHeaders() {
            const userId = localStorage.getItem('user_id');
            return userId ? { 'X-User-ID': userId } : {};
        }

        async function init() {
            const userId = localStorage.getItem('user_id');
            if (userId) {
                try {
                    const response = await fetch(API_URL + '/api/user/me', { headers: getAuthHeaders() });
                    if (response.ok) {
                        currentUser = await response.json();
                        updateUserBadge();
                    } else {
                        localStorage.removeItem('user_id');
                    }
                } catch (e) {
                    console.error('Auth check error:', e);
                }
            }
            await loadGames();
            initLevelSelector();
            initTypeSelector();
            renderCalendar();
        }

        function handleUserBadgeClick() {
            if (currentUser) {
                if (confirm('Выйти из аккаунта?')) {
                    logout();
                }
            } else {
                showAuth('login');
            }
        }

        function updateUserBadge() {
            const badge = document.getElementById('user-badge');
            if (badge && currentUser) {
                badge.textContent = currentUser.username;
            } else if (badge) {
                badge.textContent = 'Вход';
            }
        }

        function initLevelSelector() {
            document.querySelectorAll('#level-selector .level-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#level-selector .level-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedLevel = btn.dataset.level;
                });
            });
        }

        function initTypeSelector() {
            document.querySelectorAll('#type-selector .type-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#type-selector .type-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedType = btn.dataset.type;
                });
            });
        }

        function renderCalendar() {
            const title = document.getElementById('calendar-title');
            const daysContainer = document.getElementById('calendar-days');
            
            const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'И��нь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            title.textContent = monthNames[currentMonth.getMonth()] + ' ' + currentMonth.getFullYear();
            
            const days = [];
            const firstDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
            const lastDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            let startDay = firstDay.getDay() - 1;
            if (startDay < 0) startDay = 6;
            
            for (let i = 0; i < startDay; i++) {
                days.push('<div class="calendar-day disabled"></div>');
            }
            
            for (let d = 1; d <= lastDay.getDate(); d++) {
                const date = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), d);
                const isPast = date < today;
                const isToday = date.getTime() === today.getTime();
                
                days.push(`
                    <div class="calendar-day ${isToday ? 'active' : ''} ${isPast ? 'disabled' : ''}" 
                         data-date="${date.toISOString().split('T')[0]}"
                         onclick="${!isPast ? `selectDate('${date.toISOString().split('T')[0]}')` : ''}">
                        <div class="day-name">${dayNames[date.getDay() === 0 ? 6 : date.getDay() - 1]}</div>
                        <div class="day-num">${d}</div>
                    </div>
                `);
            }
            
            daysContainer.innerHTML = days.join('');
            
            if (!selectedDate) {
                const todayStr = new Date().toISOString().split('T')[0];
                selectDate(todayStr);
            }
        }

        function changeMonth(delta) {
            currentMonth.setMonth(currentMonth.getMonth() + delta);
            renderCalendar();
        }

        async function selectDate(dateStr) {
            selectedDate = dateStr;
            selectedTime = null;
            
            document.querySelectorAll('.calendar-day').forEach(d => {
                d.classList.remove('active');
                if (d.dataset.date === dateStr) d.classList.add('active');
            });
            
            await loadOccupiedSlots();
            renderTimeSlots();
        }

        async function loadOccupiedSlots() {
            if (!selectedDate) return;
            
            try {
                const response = await fetch(API_URL + '/api/slots?date=' + selectedDate);
                if (response.ok) {
                    occupiedSlots = await response.json();
                } else {
                    occupiedSlots = [];
                }
            } catch (e) {
                console.error('loadOccupiedSlots error:', e);
                occupiedSlots = [];
            }
        }

        function renderTimeSlots() {
            const container = document.getElementById('time-slots');
            
            container.innerHTML = TIME_SLOTS.map(time => {
                const isOccupied = occupiedSlots.some(s => s.start_time === time);
                return `
                    <div class="time-slot ${isOccupied ? 'occupied' : ''} ${selectedTime === time ? 'selected' : ''}" 
                         data-time="${time}"
                         onclick="${!isOccupied ? `selectTime('${time}')` : ''}">
                        ${time}
                    </div>
                `;
            }).join('');
        }

        function selectTime(time) {
            selectedTime = time;
            document.querySelectorAll('.time-slot').forEach(s => {
                s.classList.remove('selected');
                if (s.dataset.time === time) s.classList.add('selected');
            });
        }

        function showAuth(mode) {
            showAuthModal = mode;
            document.getElementById('auth-modal-title').textContent = mode === 'login' ? 'Вход' : 'Регистрация';
            document.getElementById('auth-submit-btn').textContent = mode === 'login' ? 'Войти' : 'Регистрация';
            document.getElementById('firstname-group').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('auth-switch').innerHTML = mode === 'login' 
                ? 'Нет аккаунта? <a href="#" onclick="showAuth(\'register\'); return false;">Регистрация</a>'
                : 'Есть аккаунт? <a href="#" onclick="showAuth(\'login\'); return false;">Вход</a>';
            document.getElementById('auth-modal').classList.add('active');
        }

        function closeAuth() {
            document.getElementById('auth-modal').classList.remove('active');
        }

        async function submitAuth(e) {
            e.preventDefault();
            const username = document.getElementById('auth-username').value;
            const password = document.getElementById('auth-password').value;
            const firstName = document.getElementById('auth-firstname').value;
            
            const endpoint = showAuthModal === 'login' ? '/api/auth/login' : '/api/auth/register';
            const body = showAuthModal === 'login' 
                ? { username, password }
                : { username, password, first_name: firstName };

            try {
                const response = await fetch(API_URL + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                const data = await response.json();
                if (response.ok) {
                    currentUser = data.user;
                    localStorage.setItem('user_id', String(currentUser.id));
                    updateUserBadge();
                    closeAuth();
                    await loadGames();
                } else {
                    showToast(data.error || 'Ошибка');
                }
            } catch (e) {
                showToast('Ошибка соединения');
            }
        }

        async function logout() {
            localStorage.removeItem('user_id');
            currentUser = null;
            await loadGames();
        }

        async function loadGames() {
            try {
                const response = await fetch(API_URL + '/api/games', { headers: getAuthHeaders() });
                if (response.ok) {
                    games = await response.json();
                } else {
                    games = [];
                }
                renderGames();
            } catch (e) {
                games = [];
                renderGames();
            }
        }

        function renderGames() {
            const container = document.getElementById('games-list');
            document.getElementById('games-count').textContent = games.length;
            
            if (games.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет игр. Создайте первую!</div>';
                return;
            }

            container.innerHTML = games.map(game => `
                <div class="game-card" onclick="showDetail(${game.id})">
                    <div class="game-card-header">
                        <span class="game-card-title">${escapeHtml(game.title)}</span>
                        <div class="game-badges">
                            <span class="badge badge-${game.game_type}">${game.game_type === 'open' ? 'Открытая' : 'Закрытая'}</span>
                            ${game.is_full ? '<span class="badge badge-full">Заполнено</span>' : ''}
                            ${game.level !== 'all' ? `<span class="badge badge-level">${game.level}</span>` : ''}
                        </div>
                    </div>
                    <div class="game-meta">
                        <span>📅 ${formatDate(game.start_time)}</span>
                        <span>👥 ${game.player_count}/4</span>
                    </div>
                    <div class="game-players">
                        ${game.players.map(p => `
                            <div class="player-dot ${!p.approved ? 'pending' : ''}" title="${escapeHtml(p.username)}">
                                ${p.username.charAt(0).toUpperCase()}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function showCreateModal() {
            if (!currentUser) {
                showToast('Войдите через аккаунт');
                return;
            }
            document.getElementById('create-modal').classList.add('active');
        }

        function closeCreateModal() {
            document.getElementById('create-modal').classList.remove('active');
            selectedTime = null;
            document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
        }

        async function createGame(e) {
            e.preventDefault();
            
            if (!selectedTime) {
                showToast('Выберите время');
                return;
            }

            const startTime = selectedDate + ' ' + selectedTime;
            const endHour = parseInt(selectedTime.split(':')[0]) + 1;
            const endTime = selectedDate + ' ' + (endHour < 10 ? '0' + endHour : endHour) + ':00';

            const data = {
                title: document.getElementById('game-title').value,
                description: document.getElementById('game-description').value,
                level: selectedLevel,
                game_type: selectedType,
                start_time: startTime,
                end_time: endTime
            };

            try {
                const response = await fetch(API_URL + '/api/games', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
                    body: JSON.stringify(data)
                });

                if (response.status === 400) {
                    const error = await response.json();
                    showToast(error.error);
                    return;
                }

                closeCreateModal();
                document.getElementById('game-title').value = '';
                document.getElementById('game-description').value = '';
                await loadGames();
                showToast('Игра создана!');
            } catch (e) {
                showToast('Ошибка создания');
            }
        }

        async function showDetail(id) {
            const game = games.find(g => g.id === id);
            if (!game) return;

            const isParticipant = currentUser && game.players.some(p => p.id === currentUser.id);
            const isCreator = currentUser && game.creator.id === currentUser.id;

            document.getElementById('detail-title').textContent = game.title;
            
            let pendingHTML = '';
            if (isCreator) {
                const pending = game.players.filter(p => !p.approved && p.id !== currentUser.id);
                if (pending.length > 0) {
                    pendingHTML = `
                        <div class="pending-section">
                            <div class="pending-title">Заявки на вход</div>
                            ${pending.map(p => `
                                <div class="pending-item">
                                    <span>@${escapeHtml(p.username)}</span>
                                    <div class="pending-actions">
                                        <button class="pending-approve" onclick="approvePlayer(${id}, ${p.id})">✓</button>
                                        <button class="pending-reject" onclick="rejectPlayer(${id}, ${p.id})">✗</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            }
            
            document.getElementById('detail-content').innerHTML = `
                <div class="detail-info">
                    <div class="detail-row">
                        <span class="detail-label">Дата и время</span>
                        <span class="detail-value">${formatDate(game.start_time)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Тип</span>
                        <span class="detail-value">${game.game_type === 'open' ? 'Открытая' : 'Закрытая'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Создатель</span>
                        <span class="detail-value">@${escapeHtml(game.creator.username)}</span>
                    </div>
                    ${game.description ? `
                    <div class="detail-row">
                        <span class="detail-label">Комментарий</span>
                        <span class="detail-value">${escapeHtml(game.description)}</span>
                    </div>
                    ` : ''}
                </div>
                ${pendingHTML}
                <div class="team-section">
                    <div class="team-box">
                        <h4>Команда A</h4>
                        ${game.players.filter(p => p.team === 'team_a').map(p => `
                            <div class="team-player">
                                @${escapeHtml(p.username)}
                                ${!p.approved ? '<span class="status pending">Ожидает</span>' : ''}
                            </div>
                        `).join('') || '<div style="color:var(--gray-400);font-size:13px;">—</div>'}
                    </div>
                    <div class="team-box">
                        <h4>Команда B</h4>
                        ${game.players.filter(p => p.team === 'team_b').map(p => `
                            <div class="team-player">
                                @${escapeHtml(p.username)}
                                ${!p.approved ? '<span class="status pending">Ожидает</span>' : ''}
                            </div>
                        `).join('') || '<div style="color:var(--gray-400);font-size:13px;">—</div>'}
                    </div>
                </div>
            `;

            let actions = '';
            if (!isParticipant && !game.is_full && currentUser) {
                actions = `<button class="btn btn-primary" onclick="joinGame(${id})">Присоединиться</button>`;
            } else if (isParticipant && !isCreator) {
                actions = `<button class="btn btn-danger" onclick="leaveGame(${id})">Покинуть</button>`;
            } else if (isCreator) {
                actions = `<button class="btn btn-danger" onclick="deleteGame(${id})">Удалить игру</button>`;
            }
            document.getElementById('detail-actions').innerHTML = actions;

            document.getElementById('detail-modal').classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        async function joinGame(id) {
            try {
                const response = await fetch(API_URL + '/api/games/' + id + '/join', { 
                    method: 'POST',
                    headers: getAuthHeaders()
                });
                if (response.status === 400) {
                    const error = await response.json();
                    showToast(error.error);
                    return;
                }
                const data = await response.json();
                closeDetailModal();
                await loadGames();
                showToast(data.approved ? 'Вы присоединились!' : 'Ожидайте подтверждения');
            } catch (e) {
                showToast('Ошибка');
            }
        }

        async function leaveGame(id) {
            try {
                await fetch(API_URL + '/api/games/' + id + '/leave', { 
                    method: 'POST',
                    headers: getAuthHeaders()
                });
                closeDetailModal();
                await loadGames();
                showToast('Вы покинули игру');
            } catch (e) {
                showToast('Ошибка');
            }
        }

        async function deleteGame(id) {
            if (confirm('Удалить игру?')) {
                try {
                    await fetch(API_URL + '/api/games/' + id, { 
                        method: 'DELETE',
                        headers: getAuthHeaders()
                    });
                    closeDetailModal();
                    await loadGames();
                    showToast('Игра удалена');
                } catch (e) {
                    showToast('Ошибка');
                }
            }
        }

        async function approvePlayer(gameId, userId) {
            try {
                await fetch(API_URL + '/api/games/' + gameId + '/approve/' + userId, { 
                    method: 'POST',
                    headers: getAuthHeaders()
                });
                await loadGames();
                showDetail(gameId);
                showToast('Игрок подтверждён');
            } catch (e) {
                showToast('Ошибка');
            }
        }

        async function rejectPlayer(gameId, userId) {
            try {
                await fetch(API_URL + '/api/games/' + gameId + '/reject/' + userId, { 
                    method: 'POST',
                    headers: getAuthHeaders()
                });
                await loadGames();
                showDetail(gameId);
                showToast('Игрок отклонён');
            } catch (e) {
                showToast('Ошибка');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
            return date.getDate() + ' ' + months[date.getMonth()] + ' ' + date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        init();
    </script>
</body>
</html>
